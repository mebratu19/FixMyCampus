<div class="login-page">
  <div class="login-card">

    <div class="logo">
      🛠️
    </div>

    <h1>FixMyCampus</h1>
    <p class="subtitle">Campus Issue Management</p>

    <form (ngSubmit)="login()">

      <div class="form-group">
        <label for="email">Email</label>

        <input
          id="email"
          type="email"
          name="email"
          [(ngModel)]="email"
          placeholder="Enter your email"
          autocomplete="email"
        />
      </div>

      <div class="form-group">
        <label for="password">Password</label>

        <input
          id="password"
          type="password"
          name="password"
          [(ngModel)]="password"
          placeholder="Enter your password"
          autocomplete="current-password"
        />
      </div>

      @if (errorMessage) {
        <div class="error-message">
          {{ errorMessage }}
        </div>
      }

      <button
        type="submit"
        [disabled]="loading"
      >
        @if (loading) {
          Signing in...
        } @else {
          Sign In
        }
      </button>

    </form>

    <p class="help-text">
      Report campus problems and track their progress.
    </p>

  </div>
</div>
